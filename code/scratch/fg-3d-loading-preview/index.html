<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FG · Demo logo 3D đang tải</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:#0c1420;color:#dfe7f4;--panel:#111d2b;--line:#263344;--bone:#243245;--front:#f5f7fc;--side:#9aaabd;--muted:#8091aa}body.light{background:#eef2f7;color:#192b43;--panel:#fff;--line:#dbe3ef;--bone:#dbe4f0;--front:#eaf1fb;--side:#8295af;--muted:#61738b}.toolbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);gap:16px}.toolbar span{font-size:12px;color:var(--muted)}button{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit;font-size:13px}button:hover{border-color:#3981ff}button:focus-visible{outline:3px solid #3981ff;outline-offset:3px}.controls{display:flex;gap:8px}.app{height:calc(100vh - 70px);min-height:500px;display:grid;grid-template-columns:72px 1fr 300px}.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:25px;padding-top:26px}.rail b{color:#3981ff}.rail i{width:24px;height:24px;border-radius:7px;background:var(--bone)}.main{position:relative;padding:30px;overflow:hidden}.row{display:flex;gap:18px;align-items:center;margin-bottom:30px;opacity:.6}.avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0}.bars{width:70%}.bone{background:var(--bone);overflow:hidden;position:relative}.bone:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#91b9ee14 50%,transparent 80%);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}.bar{height:13px;margin:10px 0;border-radius:6px;width:75%}.short{width:35%}.side{padding:28px 20px;border-left:1px solid var(--line)}.card{height:115px;background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:20px;padding:22px}.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#0c1420 0%,#0c1420e8 26%,#0c142090 45%,transparent 72%);pointer-events:none}body.light .loader{background:radial-gradient(ellipse at center,#eef2f7 0%,#eef2f7ed 26%,#eef2f79c 45%,transparent 72%)}.stage{position:relative;width:220px;height:230px;perspective:750px;display:grid;place-items:center}.logo{width:176px;height:176px;overflow:visible;filter:drop-shadow(0 15px 16px #0004);animation:float 4.5s ease-in-out infinite;transform-origin:center}.shadow{position:absolute;bottom:16px;width:135px;height:16px;background:#247bff33;filter:blur(9px);border-radius:50%;animation:shadow 4.5s ease-in-out infinite}.label{font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}.dots{display:flex;gap:4px}.dots i{width:5px;height:5px;border-radius:50%;background:#3981ff;animation:dot 1.4s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}.note{font-size:11px;color:var(--muted);margin-top:15px}.paused *,.paused *:after{animation-play-state:paused!important}@keyframes float{0%,100%{transform:translateY(4px) rotateX(7deg) rotateY(-11deg) rotateZ(-2deg)}50%{transform:translateY(-9px) rotateX(-3deg) rotateY(9deg) rotateZ(1deg)}}@keyframes shadow{50%{transform:scale(.83);opacity:.5}}@keyframes shimmer{100%{transform:translateX(100%)}}@keyframes dot{0%,80%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important}}@media(max-width:700px){.app{grid-template-columns:56px 1fr}.side{display:none}.main{padding:22px 15px}.toolbar{padding:12px;height:auto;flex-wrap:wrap}.toolbar span{display:block;margin-top:3px}.app{height:calc(100vh - 95px)}.logo{width:145px}.stage{width:180px}.note{max-width:230px;text-align:center;line-height:1.5}}
.rotor{position:relative;width:176px;height:176px;transform-style:preserve-3d;animation:spin 6s linear infinite;will-change:transform}.rotor .logo{position:absolute;inset:0;width:100%;height:100%;animation:none;filter:none;backface-visibility:visible}.rotor .depth use{fill:#164183;stroke:#164183;stroke-width:2}.rotor .depth use[href="#f"]{fill:#9aaabd;stroke:#9aaabd}.progress{width:210px;height:5px;background:var(--bone);border-radius:99px;overflow:hidden;margin-top:12px}.progress-fill{height:100%;width:45%;border-radius:inherit;background:linear-gradient(90deg,#1761e8,#68aaff);animation:progress 2s ease-in-out infinite;box-shadow:0 0 12px #3981ff60}.stage{height:235px}.note{margin-top:14px}@keyframes spin{0%{transform:translateY(-5px) rotateX(-8deg) rotateY(0deg)}25%{transform:translateY(-13px) rotateX(-8deg) rotateY(90deg)}50%{transform:translateY(-5px) rotateX(-8deg) rotateY(180deg)}75%{transform:translateY(3px) rotateX(-8deg) rotateY(270deg)}100%{transform:translateY(-5px) rotateX(-8deg) rotateY(360deg)}}@keyframes progress{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}@media(max-width:700px){.rotor{width:145px;height:145px}.progress{width:180px}}@media(prefers-reduced-motion:reduce){.rotor{animation:none;transform:rotateX(-8deg) rotateY(-15deg)}.progress-fill{animation:none;transform:translateX(60%)}}
</style>
<header class="toolbar"><div><strong>FG · Logo 3D</strong> <span>Bản demo chuyển động</span></div><div class="controls"><button id="motion" aria-pressed="false">Tạm dừng</button><button id="theme" aria-pressed="false">Nền sáng</button></div></header>
<div class="app"><nav class="rail" aria-label="Khung sidebar minh họa"><b>FG</b><i></i><i></i><i></i><i></i><i></i></nav><main class="main" aria-label="Demo skeleton"><div id="rows" aria-hidden="true"></div><div class="loader"><div class="stage"><div class="shadow"></div><svg class="logo" viewBox="0 0 400 380" role="img" aria-label="Logo FG ghép khối 3D"><defs><path id="f" d="M20 75 75 20H290L226 86H85V123H184L122 189H85V275L20 341Z"/><path id="g" d="M215 108H351L387 144V174H191V279H315V239H213L274 178H387V309L325 369H159L123 333V193Z"/><linearGradient id="white" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#dde7f3"/><stop offset="1" stop-color="#a9bacf"/></linearGradient><linearGradient id="blue" x2=".8" y2="1"><stop stop-color="#5799ff"/><stop offset=".48" stop-color="#2474fa"/><stop offset="1" stop-color="#0748c5"/></linearGradient></defs><g fill="#073581" stroke="#073581" stroke-width="4"><use href="#g" transform="translate(13 15)"/></g><g fill="var(--side)" stroke="var(--side)" stroke-width="4"><use href="#f" transform="translate(13 15)"/></g><use href="#f" fill="url(#white)" stroke="#f4f8ff" stroke-width="2"/><use href="#g" fill="url(#blue)" stroke="#5093ff" stroke-width="2"/></svg></div><div class="label">Đang tải FG<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></div><div class="note">Minh họa màn hình chờ · Không kết nối API</div></div></main><aside class="side" aria-hidden="true"><div class="card"><div class="bar bone"></div><div class="bar short bone"></div></div><div class="card"><div class="bar bone"></div><div class="bar short bone"></div></div><div id="online"></div></aside></div>
<script>
const face=document.querySelector('svg.logo');
const rotor=document.createElement('div');rotor.className='rotor';
face.before(rotor);
for(let z=-10;z<10;z+=1){const layer=face.cloneNode(true);layer.classList.add('depth');layer.removeAttribute('role');layer.removeAttribute('aria-label');layer.setAttribute('aria-hidden','true');layer.querySelector('defs').remove();layer.style.transform='translateZ('+z+'px)';rotor.append(layer);}
face.style.transform='translateZ(10px)';rotor.append(face);
document.querySelector('.label').remove();
const progress=document.createElement('div');progress.className='progress';progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Minh họa đang tải FG');progress.innerHTML='<div class="progress-fill"></div>';
document.querySelector('.stage').after(progress);
document.querySelector('.note').textContent='Demo chuyển động · Thanh chờ minh họa';
const row='<div class="row"><div class="avatar bone"></div><div class="bars"><div class="bar short bone"></div><div class="bar bone"></div></div></div>';
document.querySelector('#rows').innerHTML=row.repeat(8);document.querySelector('#online').innerHTML=row.repeat(5);
document.querySelector('#motion').onclick=function(){const paused=document.body.classList.toggle('paused');this.textContent=paused?'Tiếp tục':'Tạm dừng';this.setAttribute('aria-pressed',String(paused));};
document.querySelector('#theme').onclick=function(){const light=document.body.classList.toggle('light');this.textContent=light?'Nền tối':'Nền sáng';this.setAttribute('aria-pressed',String(light));};
</script>
</html>
